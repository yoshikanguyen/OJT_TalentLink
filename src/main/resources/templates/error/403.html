<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('403 - Không có quyền truy cập', ~{::section})}">
<section class="container py-5 text-center">
    <h1 class="display-4 fw-bold text-warning">403</h1>
    <h2 class="h4 mb-3" th:text="${errorTitle} ?: 'Không có quyền truy cập'">Không có quyền truy cập</h2>
    <p class="text-muted mb-4" th:text="${errorMessage} ?: 'Bạn không có quyền xem nội dung này.'">Bạn không có quyền xem nội dung này.</p>
    <a th:href="@{/}" class="btn btn-primary">Về trang chủ</a>
</section>
</html>
