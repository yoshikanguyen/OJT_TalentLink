<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Đăng ký sinh viên - TalentLink</title>
  <style>
    .field-error { color: #c0392b; font-size: 0.9em; margin-top: 4px; }
    .form-group { margin-bottom: 12px; }
  </style>
</head>
<body>
<h2>Đăng ký tài khoản sinh viên</h2>

<form th:action="@{/register/student}" th:object="${registerForm}" method="post">
  <div class="form-group">
    <label for="fullName">Họ tên:</label><br>
    <input type="text" id="fullName" th:field="*{fullName}">
    <div class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
  </div>

  <div class="form-group">
    <label for="email">Email:</label><br>
    <input type="email" id="email" th:field="*{email}">
    <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
  </div>

  <div class="form-group">
    <label for="password">Mật khẩu:</label><br>
    <input type="password" id="password" th:field="*{password}">
    <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
  </div>

  <div class="form-group">
    <label for="confirmPassword">Nhập lại mật khẩu:</label><br>
    <input type="password" id="confirmPassword" th:field="*{confirmPassword}">
    <div class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
  </div>

  <button type="submit">Đăng ký</button>
</form>
</body>
</html>
