<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đổi mật khẩu - TalentLink</title>
</head>
<body>
<h2>Đổi mật khẩu</h2>

<div th:if="${successMessage}" style="color: green;">
    <p th:text="${successMessage}"></p>
</div>

<div th:if="${errorMessage}" style="color: red;">
    <p th:text="${errorMessage}"></p>
</div>

<form th:action="@{/account/change-password}" th:object="${changePasswordForm}" method="post">
    <div>
        <label for="currentPassword">Mật khẩu cũ:</label>
        <input type="password" id="currentPassword" th:field="*{currentPassword}" required>
    </div>

    <div>
        <label for="newPassword">Mật khẩu mới:</label>
        <input type="password" id="newPassword" th:field="*{newPassword}" required>
    </div>

    <div>
        <label for="confirmPassword">Xác nhận mật khẩu mới:</label>
        <input type="password" id="confirmPassword" th:field="*{confirmPassword}" required>
    </div>

    <button type="submit">Cập nhật mật khẩu</button>
</form>
</body>
</html>
