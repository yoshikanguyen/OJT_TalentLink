<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout('404 - Không tìm thấy trang', ~{::section})}">
<section class="container py-5 text-center">
    <h1 class="display-4 fw-bold text-secondary">404</h1>
    <h2 class="h4 mb-3" th:text="${errorTitle} ?: 'Không tìm thấy trang'">Không tìm thấy trang</h2>
    <p class="text-muted mb-4" th:text="${errorMessage} ?: 'Trang hoặc dữ liệu bạn tìm không tồn tại.'">Trang hoặc dữ liệu bạn tìm không tồn tại.</p>
    <a th:href="@{/}" class="btn btn-primary">Về trang chủ</a>
</section>
</html>
