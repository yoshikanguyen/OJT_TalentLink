<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="header" class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">TalentLink</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"
                aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <!-- Menu khi đã đăng nhập -->
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/profile}">Hồ sơ của tôi</a>
                </li>

                <!-- Menu dành cho Ứng viên -->
                <li class="nav-item" sec:authorize="hasRole('CANDIDATE')">
                    <a class="nav-link" th:href="@{/candidate/interviews}">Yêu cầu phỏng vấn</a>
                </li>

                <!-- Menu dành cho Nhà tuyển dụng / HR -->
                <li class="nav-item" sec:authorize="hasAnyRole('RECRUITER', 'HR')">
                    <a class="nav-link" th:href="@{/candidates}">Tìm ứng viên</a>
                </li>
                <li class="nav-item" sec:authorize="hasAnyRole('RECRUITER', 'HR')">
                    <a class="nav-link" th:href="@{/interviews}">Yêu cầu phỏng vấn</a>
                </li>

                <!-- Menu dành cho Quản trị viên -->
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/admin/users}">Quản trị tài khoản</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/admin/approvals}">Hàng chờ duyệt</a>
                </li>
            </ul>

            <!-- Khu vực tài khoản bên phải -->
            <div class="d-flex align-items-center gap-2" sec:authorize="isAuthenticated()">
                <span class="text-light small" sec:authentication="name">Người dùng</span>
                <form th:action="@{/logout}" method="post" class="d-inline m-0">
                    <button type="submit" class="btn btn-outline-light btn-sm">Đăng xuất</button>
                </form>
            </div>

            <div class="d-flex align-items-center gap-2" sec:authorize="!isAuthenticated()">
                <a class="btn btn-outline-light btn-sm" th:href="@{/login}">Đăng nhập</a>
                <a class="btn btn-primary btn-sm" th:href="@{/register}">Đăng ký</a>
            </div>
        </div>
    </div>
</header>
</body>
</html>
