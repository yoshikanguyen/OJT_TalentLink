<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hồ sơ của tôi</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 720px; margin: 32px auto; padding: 0 16px; }
        .field { margin-bottom: 16px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; }
        input[type="text"], input[type="date"], textarea {
            width: 100%; padding: 8px 10px; box-sizing: border-box;
        }
        .error { color: #c62828; font-size: 0.9rem; margin-top: 4px; }
        .alert-success { background: #e8f5e9; color: #1b5e20; padding: 10px 12px; margin-bottom: 16px; border-radius: 4px; }
        .readonly-info { color: #555; margin-bottom: 16px; }
        button { padding: 10px 18px; cursor: pointer; }
    </style>
</head>
<body>
<h1>Hồ sơ của tôi</h1>
<p class="readonly-info">Tài khoản đăng nhập: <strong th:text="${userEmail}">email@example.com</strong></p>

<div th:if="${successMessage}" class="alert-success" th:text="${successMessage}"></div>

<form th:action="@{/me/profile}" th:object="${profileForm}" method="post" novalidate>
    <div class="field">
        <label for="fullName">Họ tên *</label>
        <input id="fullName" type="text" th:field="*{fullName}">
        <div class="error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
    </div>

    <div class="field">
        <label for="dateOfBirth">Ngày sinh</label>
        <input id="dateOfBirth" type="date" th:field="*{dateOfBirth}">
        <div class="error" th:if="${#fields.hasErrors('dateOfBirth')}" th:errors="*{dateOfBirth}"></div>
    </div>

    <div class="field">
        <label for="phone">Số điện thoại</label>
        <input id="phone" type="text" th:field="*{phone}" placeholder="Ví dụ: 0901234567">
        <div class="error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
    </div>

    <div class="field">
        <label for="desiredPosition">Vị trí mong muốn</label>
        <input id="desiredPosition" type="text" th:field="*{desiredPosition}" placeholder="Ví dụ: Backend Developer / BrSE">
        <div class="error" th:if="${#fields.hasErrors('desiredPosition')}" th:errors="*{desiredPosition}"></div>
    </div>

    <div class="field">
        <label for="desiredLocation">Nơi làm việc mong muốn</label>
        <input id="desiredLocation" type="text" th:field="*{desiredLocation}" placeholder="Ví dụ: TP. Hồ Chí Minh">
        <div class="error" th:if="${#fields.hasErrors('desiredLocation')}" th:errors="*{desiredLocation}"></div>
    </div>

    <div class="field">
        <label for="bio">Giới thiệu bản thân</label>
        <textarea id="bio" rows="4" th:field="*{bio}" placeholder="Giới thiệu ngắn gọn về kinh nghiệm, mục tiêu..."></textarea>
        <div class="error" th:if="${#fields.hasErrors('bio')}" th:errors="*{bio}"></div>
    </div>

    <button type="submit">Lưu thay đổi</button>
</form>
</body>
</html>
