<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập - TalentLink</title>
</head>
<body>
<h2>Đăng nhập hệ thống</h2>

<div th:if="${errorMessage}" style="color: #b91c1c; margin-bottom: 12px;">
    <p th:text="${errorMessage}"></p>
</div>

<div th:if="${logoutMessage}" style="color: #15803d; margin-bottom: 12px;">
    <p th:text="${logoutMessage}"></p>
</div>

<!-- th:action tự động thêm _csrf hidden input khi CSRF bật -->
<form th:action="@{/login}" method="post">
    <div>
        <label for="email">Email</label>
        <input id="email" type="email" name="email" required autofocus placeholder="name@example.com">
    </div>

    <div>
        <label for="password">Mật khẩu</label>
        <input id="password" type="password" name="password" required placeholder="Nhập mật khẩu">
    </div>

    <div>
        <input id="remember-me" type="checkbox" name="remember-me">
        <label for="remember-me">Ghi nhớ đăng nhập</label>
    </div>

    <button type="submit">Đăng nhập</button>
</form>
</body>
</html>
