<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quên mật khẩu - TalentLink</title>
</head>
<body>
<h2>Quên mật khẩu</h2>

<div th:if="${errorMessage}" style="color: red;">
    <p th:text="${errorMessage}"></p>
</div>

<form th:action="@{/account/forgot-password}" th:object="${forgotPasswordForm}" method="post">
    <div>
        <label for="email">Email tài khoản:</label>
        <input type="email" id="email" th:field="*{email}" required>
    </div>

    <button type="submit">Gửi mã OTP</button>
</form>

<p>
    Đã có mã OTP? <a th:href="@{/account/reset-password}">Nhập mã OTP tại đây</a>
</p>
</body>
</html>
