<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đặt lại mật khẩu bằng OTP - TalentLink</title>
</head>
<body>
<h2>Đặt lại mật khẩu bằng mã OTP</h2>

<div th:if="${successMessage}" style="color: green;">
    <p th:text="${successMessage}"></p>
</div>

<div th:if="${errorMessage}" style="color: red;">
    <p th:text="${errorMessage}"></p>
</div>

<form th:action="@{/account/reset-password}" th:object="${resetPasswordForm}" method="post">
    <div>
        <label for="email">Email:</label>
        <input type="email" id="email" th:field="*{email}" required>
    </div>

    <div>
        <label for="otpCode">Mã OTP (6 số):</label>
        <input type="text" id="otpCode" th:field="*{otpCode}" maxlength="6" pattern="\d{6}" required>
    </div>

    <div>
        <label for="newPassword">Mật khẩu mới:</label>
        <input type="password" id="newPassword" th:field="*{newPassword}" required>
    </div>

    <div>
        <label for="confirmPassword">Xác nhận mật khẩu mới:</label>
        <input type="password" id="confirmPassword" th:field="*{confirmPassword}" required>
    </div>

    <button type="submit">Xác nhận đổi mật khẩu</button>
</form>

<p>
    Chưa nhận được mã hoặc mã đã hết hạn/bị hủy?
    <a th:href="@{/account/forgot-password}">Yêu cầu mã OTP mới</a>
</p>
</body>
</html>
